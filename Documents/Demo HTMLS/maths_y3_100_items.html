<style>
  :root {
    --sky: #4fc3f7;
    --sky-dark: #29a3e0;
    --sun: #ffc93c;
    --grass: #4ecb71;
    --grass-dark: #33a856;
    --coral: #ff6f6f;
    --purple: #a78bfa;
    --ink: #2c3550;
    --card: #ffffff;
    --bg1: #eaf7ff;
    --bg2: #fff6e5;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: 'Nunito', system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%);
    overflow-x: hidden;
  }

  h1, h2, h3, .heading {
    font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  }

  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(2px);
    opacity: 0.35;
    z-index: 0;
    animation: float 9s ease-in-out infinite;
  }
  .blob1 { width: 160px; height: 160px; background: var(--sun); top: -40px; left: -50px; animation-delay: 0s; }
  .blob2 { width: 120px; height: 120px; background: var(--grass); bottom: 10%; right: -40px; animation-delay: 2s; }
  .blob3 { width: 90px; height: 90px; background: var(--purple); top: 30%; right: 6%; animation-delay: 4s; }
  .blob4 { width: 70px; height: 70px; background: var(--coral); bottom: 4%; left: 8%; animation-delay: 1s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-18px) scale(1.06); }
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 600px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 22px;
    color: var(--sky-dark);
  }
  .brand .dot { color: var(--coral); }

  .stat-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    border-radius: 999px;
    padding: 6px 12px;
    font-weight: 800;
    font-size: 14px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.06);
  }
  .stats-row { display: flex; gap: 8px; }

  #starCount, #streakCount { transition: transform 0.25s ease; display: inline-block; }
  .pop { animation: pop 0.4s ease; }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.5); }
    100% { transform: scale(1); }
  }

  .mascot-card {
    text-align: center;
    margin-bottom: 10px;
  }
  .mascot {
    font-size: 56px;
    display: inline-block;
    animation: bob 2.4s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-8px) rotate(2deg); }
  }
  .speech {
    background: var(--card);
    border-radius: 16px;
    padding: 10px 16px;
    display: inline-block;
    font-weight: 700;
    font-size: 15px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.06);
    margin-top: 4px;
    max-width: 90%;
  }

  .progress-outer {
    background: rgba(255,255,255,0.7);
    border-radius: 999px;
    height: 16px;
    overflow: hidden;
    margin: 18px 0 6px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
  }
  .progress-inner {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--grass), var(--grass-dark));
    width: 0%;
    transition: width 0.5s cubic-bezier(.4,1.6,.6,1);
    position: relative;
  }
  .progress-label {
    text-align: right;
    font-size: 12px;
    font-weight: 700;
    color: #6b7590;
    margin-bottom: 14px;
  }

  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 22px 20px 20px;
    box-shadow: 0 10px 0 rgba(0,0,0,0.05), 0 14px 30px rgba(41,163,224,0.12);
    position: relative;
    overflow: hidden;
  }

  .badge-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .subject-badge {
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 5px 10px;
    border-radius: 999px;
    color: white;
  }
  .subject-badge.maths { background: var(--sky-dark); }
  .slot-badge {
    font-size: 12px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 999px;
    background: #fff3d6;
    color: #a56a00;
  }

  .question-text {
    font-family: 'Baloo 2', sans-serif;
    font-size: 21px;
    font-weight: 700;
    line-height: 1.35;
    margin: 4px 0 18px;
    color: var(--ink);
  }

  .text-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .text-input {
    flex: 1;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    padding: 13px 16px;
    border-radius: 14px;
    border: 2.5px solid #e3e9f5;
    outline: none;
  }
  .text-input:focus { border-color: var(--sky); }

  .hint-btn {
    background: none;
    border: none;
    font-family: inherit;
    font-weight: 800;
    font-size: 14px;
    color: #b7791f;
    cursor: pointer;
    padding: 6px 0;
  }
  .hint-box {
    background: #fff8e6;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 700;
    color: #8a5a00;
    margin-top: 6px;
  }

  .check-btn {
    width: 100%;
    font-family: 'Baloo 2', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: white;
    background: linear-gradient(180deg, var(--sky), var(--sky-dark));
    border: none;
    border-radius: 16px;
    padding: 15px;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--sky-dark);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .check-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--sky-dark); }
  .check-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

  .feedback {
    border-radius: 18px;
    padding: 18px;
    margin-top: 4px;
    animation: slideUp 0.35s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .feedback.good { background: #e4f9ea; }
  .feedback.retry { background: #fff2e2; }
  .feedback h3 { margin: 0 0 10px; font-size: 19px; }
  .feedback.good h3 { color: #1c7a3c; }
  .feedback.retry h3 { color: #b06a00; }
  .feedback ol { margin: 0 0 12px; padding-left: 20px; font-size: 14px; font-weight: 700; line-height: 1.6; }
  .next-btn {
    width: 100%;
    font-family: 'Baloo 2', sans-serif;
    font-size: 17px;
    font-weight: 800;
    color: white;
    background: linear-gradient(180deg, #3d4568, var(--ink));
    border: none;
    border-radius: 14px;
    padding: 13px;
    cursor: pointer;
    box-shadow: 0 4px 0 #1b2038;
  }

  .complete {
    display: none;
    text-align: center;
    background: var(--card);
    border-radius: 24px;
    padding: 40px 24px;
    box-shadow: 0 10px 0 rgba(0,0,0,0.05), 0 14px 30px rgba(41,163,224,0.12);

  .complete p { font-weight: 700; color: #5c6584; margin: 0 0 22px; }
  .summary-row {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 26px;
    flex-wrap: wrap;
  }
  .summary-pill {
    background: #f8fafd;
    border-radius: 16px;
    padding: 12px 18px;
    font-weight: 800;
    min-width: 90px;
  }

  .replay-btn {

    font-weight: 800;
    color: var(--sky-dark);
    background: #eaf7ff;

    text-align: center;
    font-size: 12px;
    color: #9aa3bd;
    margin-top: 22px;
    font-weight: 700;

</style>
</head>

let idx = 0, stars = 0, streak = 0, bestStreak = 0, correctCount = 0, hintUsed = false;

const speechLines = {
  start: ["Hi! Ready for today's 100-item math mission?", "Let's warm up our brains! 🧠", "You've got this!"],
  correctStreak: ["Whoa, on fire! 🔥", "You're on a roll!", "Nailed it again!"],
  correct: ["Yes! Nice thinking!", "That's it!", "Great job!"],
  retry: ["Good try — let's learn this one together.", "Almost! Here's how it works.", "No worries, mistakes help us grow 🌱"]
};

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function setSpeech(text) { document.getElementById('speech').textContent = text; }
function setMascot(e) { document.getElementById('mascot').textContent = e; }

function normalize(s) {
  return String(s).trim().toLowerCase().replace(/\s+/g, " ").replace(/[.,;:!?]+$/g, "");
}

function bump(id) {
  const el = document.getElementById(id);
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
}

function updateProgress() {
  const pct = (idx / ITEMS.length) * 100;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = Math.min(idx + 1, ITEMS.length) + ' / ' + ITEMS.length;
}

function renderQuestion() {
  hintUsed = false;
  const item = ITEMS[idx];
  const card = document.getElementById('questionCard');
  updateProgress();

  card.innerHTML = `
    <div class="badge-row">
      <span class="subject-badge maths">🔢 Maths (Year 3 VIC & NSW)</span>
      <span class="slot-badge">${item.slot}</span>
    </div>
    <p class="question-text">${item.q}</p>
    <div class="text-input-row">
      <input type="text" class="text-input" id="answerInput" placeholder="Type your answer…" autocomplete="off" onkeydown="if(event.key==='Enter') submitAnswer()">
    </div>
    <div id="hintArea">
      <button class="hint-btn" onclick="showHint()">💡 Need a hint?</button>
    </div>
    <div style="height:14px"></div>
    <button class="check-btn" id="checkBtn" onclick="submitAnswer()">Check my answer</button>
  `;

  setTimeout(() => document.getElementById('answerInput')?.focus(), 50);
}

function showHint() {
  hintUsed = true;
  const item = ITEMS[idx];
  document.getElementById('hintArea').innerHTML =
    `<div class="hint-box">💡 ${item.hint}</div>`;
}

function submitAnswer() {
  const item = ITEMS[idx];
  const given = document.getElementById('answerInput').value;
  document.getElementById('answerInput').disabled = true;

  const isCorrect = item.answers.map(normalize).includes(normalize(given || ''));
  const card = document.getElementById('questionCard');
  document.getElementById('checkBtn').remove();

  if (isCorrect) {
    correctCount++;
    streak++;
    bestStreak = Math.max(bestStreak, streak);
    const gained = hintUsed ? 5 : 10;
    stars += gained;
    document.getElementById('starCount').textContent = stars;
    document.getElementById('streakCount').textContent = streak;
    bump('starCount'); bump('streakCount');
    setMascot(streak >= 3 ? '🤩' : '🦊');
    setSpeech(streak >= 3 ? pick(speechLines.correctStreak) : pick(speechLines.correct));

    const fb = document.createElement('div');
    fb.className = 'feedback good';
    fb.innerHTML = `
      <h3>Nice work — that's correct! 🎉  <span style="float:right">+${gained}⭐</span></h3>
      <ol>${item.steps.map(s => `<li>${s}</li>`).join('')}</ol>
      <button class="next-btn" onclick="nextItem()">Next question →</button>
    `;
    card.appendChild(fb);
  } else {
    streak = 0;
    document.getElementById('streakCount').textContent = streak;
    setMascot('🙂');
    setSpeech(pick(speechLines.retry));

    const fb = document.createElement('div');
    fb.className = 'feedback retry';
    fb.innerHTML = `
      <h3>Good try — let's see how to get there 🌱 (Correct answer: ${item.answers[0]})</h3>
      <ol>${item.steps.map(s => `<li>${s}</li>`).join('')}</ol>
      <button class="next-btn" onclick="nextItem()">Next question →</button>
    `;
    card.appendChild(fb);
  }
}

function nextItem() {
  idx++;
  if (idx >= ITEMS.length) {
    showComplete();
  } else {
    renderQuestion();
  }
}

function showComplete() {
  updateProgress();
  document.getElementById('questionCard').style.display = 'none';
  document.getElementById('completeCard').style.display = 'block';
  document.getElementById('finalStars').textContent = stars;
  document.getElementById('finalStreak').textContent = bestStreak;
  document.getElementById('finalCorrect').textContent = correctCount + '/' + ITEMS.length;

  let msg = "You smashed all 100 items — phenomenal work!";
  if (correctCount === ITEMS.length) msg = "Perfect score across all 100 items — extraordinary! 🌟";
  document.getElementById('completeMsg').textContent = msg;

  const stickerSets = ['🌟🦄🎈', '🚀🪐✨', '🐝🌼🍯', '🦕🌈🎉'];
  document.getElementById('stickers').textContent = stickerSets[Math.floor(Math.random()*stickerSets.length)];

  setMascot('🏆');
  setSpeech("Mission complete — amazing dedication!");
}

function restart() {
  idx = 0; stars = 0; streak = 0; bestStreak = 0; correctCount = 0;
  document.getElementById('starCount').textContent = 0;
  document.getElementById('streakCount').textContent = 0;
  document.getElementById('completeCard').style.display = 'none';
  document.getElementById('questionCard').style.display = 'block';
  setMascot('🦊');
  setSpeech(pick(speechLines.start));
  renderQuestion();
}

setSpeech(pick(speechLines.start));
renderQuestion();
</script>
